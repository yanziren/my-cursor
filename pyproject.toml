[project]
name = "mycoder"
version = "0.1.0"
description = "按《30天从零构建Cursor级编程智能体》逐天构建的编程智能体 harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.6.0",
]

[project.scripts]
mycoder = "mycoder.repl:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
